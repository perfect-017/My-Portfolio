<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 465 880"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Procedural texture: no embedded JPEG/raster image -->
    <filter id="leatherTexture"
            x="-10%" y="-10%" width="120%" height="120%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.018 0.055"
                    numOctaves="5"
                    seed="17"
                    stitchTiles="stitch"
                    result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="
          0.34 0    0    0  0.12
          0    0.34 0    0  0.12
          0    0    0.34 0  0.12
          0    0    0    0.55 0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>

    <filter id="fineGrain"
            x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.42"
                    numOctaves="3"
                    seed="9"
                    stitchTiles="stitch"
                    result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.12" intercept="0.02"/>
        <feFuncG type="linear" slope="0.12" intercept="0.02"/>
        <feFuncB type="linear" slope="0.12" intercept="0.02"/>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="overlay"/>
    </filter>

    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="0.48" stop-color="#090909"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>

    <radialGradient id="softLight" cx="48%" cy="42%" r="78%">
      <stop offset="0" stop-color="#242424" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#101010" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity=".28"/>
    </radialGradient>
  </defs>

  <!-- Scalable base -->
  <rect width="465" height="880" fill="url(#base)"/>

  <!-- Broad, organic material texture -->
  <rect x="-8" y="-8" width="481" height="896"
        fill="#161616"
        filter="url(#leatherTexture)"
        opacity=".95"/>

  <!-- Subtle lighting variation -->
  <rect width="465" height="880" fill="url(#softLight)"/>

  <!-- Fine grain -->
  <rect x="-8" y="-8" width="481" height="896"
        fill="#151515"
        filter="url(#fineGrain)"
        opacity=".7"/>

  <!-- Very subtle irregular crease-like lines -->
  <g fill="none" stroke="#000" stroke-opacity=".16" stroke-width="1.1">
    <path d="M-20 82 C80 72 145 99 235 78 S395 76 485 94"/>
    <path d="M-30 251 C65 238 125 270 220 248 S390 237 490 257"/>
    <path d="M-25 364 C85 352 160 379 250 362 S400 354 490 370"/>
    <path d="M-30 517 C75 503 160 532 255 512 S405 505 490 524"/>
    <path d="M-20 646 C90 631 165 663 265 644 S400 636 490 655"/>
    <path d="M-25 755 C80 742 150 770 245 751 S400 746 490 765"/>
  </g>
</svg>
